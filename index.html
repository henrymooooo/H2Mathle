<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H2 Mathle</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f8f6f0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body data-theme="pure">
  <div class="app-shell">
    <aside class="folio-rail">
      <header class="top-header">
        <div class="brand">
          <span class="brand-accent">H2 Mathle</span>
          <small class="brand-sub">Syllabus 9758</small>
        </div>

        <nav class="nav-tabs" role="tablist">
          <button class="tab-btn active" role="tab" aria-selected="true" data-tab="pure" id="tab-pure">
            <span>Pure</span><span class="tab-key">1</span>
          </button>
          <button class="tab-btn" role="tab" aria-selected="false" data-tab="stats" id="tab-stats">
            <span>Statistics</span><span class="tab-key">2</span>
          </button>
          <button class="tab-btn" role="tab" aria-selected="false" data-tab="random" id="tab-random">
            <span>Practice</span><span class="tab-key">3</span>
          </button>
          <button class="tab-btn" role="tab" aria-selected="false" data-tab="calendar" id="tab-calendar">
            <span>Calendar</span><span class="tab-key">4</span>
          </button>
          <button class="tab-btn" role="tab" aria-selected="false" data-tab="mistakes" id="tab-mistakes">
            <span>Study Log</span><span class="tab-key">5</span>
          </button>
        </nav>
      </header>

      <div class="meta-bar">
        <div class="meta-row"><span>STREAK</span><strong id="streak-count">0</strong></div>
        <div class="meta-row"><span>TODAY</span><strong id="today-progress">0/2</strong></div>
        <div class="meta-row"><span>RESET <small>(6AM SGT)</small></span><strong id="reset-timer">--:--:--</strong></div>
      </div>

      <div class="folio-tools">
        <button type="button" class="meta-link" id="btn-mf26" title="Open MF27 Formula Reference (M)">
          <span>MF27 Reference</span><span class="tool-key">[M]</span>
        </button>
        <button type="button" class="meta-link" id="btn-scratchpad" title="Open Scratchpad Whiteboard (W)">
          <span>Scratchpad</span><span class="tool-key">[W]</span>
        </button>
        <button type="button" class="meta-link" id="btn-ask" title="Open Question Help (A)">
          <span>Ask</span><span class="tool-key">[A]</span>
        </button>
      </div>
    </aside>

    <div class="folio-workspace">
      <div class="folio-column">
        <main id="main-content" class="main-content"></main>
        <footer class="folio-colophon" id="folio-colophon">
          <div class="colophon-bar">
            <span>H2 Mathle</span>
            <span class="colophon-sep">&middot;</span>
            <button type="button" class="colophon-link" id="btn-feedback" aria-expanded="false">Feedback</button>
            <span class="colophon-sep">&middot;</span>
            <a class="colophon-link" href="https://buymeacoffee.com/henrymoo" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
          </div>
          <form class="feedback-panel" id="feedback-form" hidden>
            <div class="feedback-head">
              <strong>Send feedback</strong>
              <span class="feedback-context" id="feedback-context"></span>
            </div>
            <div class="feedback-row">
              <select class="feedback-input" id="feedback-type" aria-label="Feedback category">
                <option value="Bug / Typo">Bug / Typo</option>
                <option value="Wrong Answer Key">Wrong Answer Key</option>
                <option value="Suggestion">Suggestion</option>
                <option value="Other">Other</option>
              </select>
              <input type="email" class="feedback-input" id="feedback-email" placeholder="Email (optional, for replies)" />
            </div>
            <textarea class="feedback-textarea" id="feedback-message" rows="3" required placeholder="Report a typo, wrong answer key, or suggestion..."></textarea>
            <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none;" />
            <div class="feedback-actions">
              <span class="feedback-status" id="feedback-status"></span>
              <div style="display:flex;gap:8px;">
                <button type="button" class="btn btn-ghost" id="feedback-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary" id="feedback-submit">Send</button>
              </div>
            </div>
          </form>
        </footer>
      </div>
      <aside class="tool-dock" id="tool-dock" aria-label="Study tools">
        <div id="mf26-modal" class="mf26-modal" aria-hidden="true"></div>
        <div id="scratchpad-modal" class="mf26-modal scratch-modal" aria-hidden="true"></div>
        <div id="ask-modal" class="mf26-modal" aria-hidden="true"></div>
      </aside>
    </div>
  </div>

  <!-- Core bank initializer & manifest -->
  <script src="questions.js"></script>
  <script src="banks/manifest.js"></script>

  <script src="app.js"></script>
</body>
</html>
