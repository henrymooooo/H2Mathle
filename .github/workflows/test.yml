name: Math and Grader Tests

on:
  push:
    paths-ignore:
      - screenshot.png
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
      - run: node --check gc.js
      - run: node --check sw.js
      - run: node --check questions.js
      - run: node --check banks/manifest.js
      - run: node --check worker/worker.js
      - run: npm test
